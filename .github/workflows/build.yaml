name: macOS Universal2 build

on:
  workflow_dispatch:
  push:
    branches:
      - qt5-macos-build-run

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.9"

      - name: Verify Intel build host
        run: |
          test "$(uname -m)" = "x86_64"

      - name: Install build dependencies
        run: |
          brew install icu4c pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      - name: Build macOS application
        run: python -m tox -vv r -m build

      - name: Verify universal2 app binaries
        shell: bash
        run: |
          set -euo pipefail
          app="dist/ComicTagger.app"
          test -d "$app"
          checked=0
          while IFS= read -r -d '' binary; do
            if [[ "$(file -b "$binary")" == *Mach-O* ]]; then
              archs="$(lipo -archs "$binary")"
              grep -qw x86_64 <<< "$archs"
              grep -qw arm64 <<< "$archs"
              checked=$((checked + 1))
            fi
          done < <(find "$app" -type f -print0)
          test "$checked" -gt 0

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: ComicTagger-macos-universal2
          path: dist/binary/*.dmg
          if-no-files-found: error
